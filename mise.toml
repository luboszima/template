# mise configuration file
# https://mise.jdx.dev/configuration.html

[tools]
terraform = "1.17.2"
terragrunt = "1.2.2"
prek = "0.5.11"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[tasks.prek]
description = "Run prek hooks on all files"
run = "prek run --all-files"

[tasks.prek-shellcheck]
description = "Run the shellcheck prek hook"
run = "prek run shellcheck"

[tasks.prek-autoupdate]
description = "Update prek hooks to the latest versions"
run = "prek autoupdate"
