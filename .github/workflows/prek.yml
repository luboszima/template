name: prek

concurrency:
  group: prek-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
      - name: Resolve prek cache directory
        id: prek-cache-dir
        run: echo "dir=$(prek cache dir)" >> "$GITHUB_OUTPUT"
      - name: Cache prek hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.prek-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-prek-
      - name: Run prek hooks
        run: prek run --all-files
        env:
          SKIP: conventional-pre-commit
