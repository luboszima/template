# https://taskfile.dev

version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  prek:
    dir: '{{.TASKFILE_DIR}}'
    desc: Run prek hooks on all files
    cmds:
      - prek run --all-files

  prek-shellcheck:
    dir: '{{.TASKFILE_DIR}}'
    desc: Run the shellcheck prek hook
    cmds:
      - prek run shellcheck

  prek-autoupdate:
    dir: '{{.TASKFILE_DIR}}'
    desc: Update prek hooks to the latest versions
    cmds:
      - prek autoupdate
